<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PORTFOLIO</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZ7K1ES3EB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-JZ7K1ES3EB");
    </script>
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <a class="brand" href="#" data-action="home">
          <span>TU NOMBRE</span>
          <span>FOTO</span>
        </a>

        <nav id="project-nav" class="project-nav" aria-label="Proyectos"></nav>

        <nav class="secondary-nav" aria-label="Navegación secundaria">
          <button class="menu-link" data-action="home">PORTADA</button>
          <button class="menu-link" data-action="contact">CONTACTO</button>
          <a id="instagram-link" class="menu-link" href="#" target="_blank" rel="noreferrer noopener">INSTAGRAM</a>
        </nav>
      </aside>

      <main class="content">
        <section id="home-view" class="view is-active" aria-labelledby="home-title">
          <h1 id="home-title" class="sr-only" tabindex="-1">Portada</h1>
          <div class="home-intro">
            <p class="home-kicker">PORTFOLIO</p>
            <p class="home-text"></p>
          </div>
          <div
            id="home-preview"
            class="frame frame-center"
            role="button"
            tabindex="0"
            aria-label="Cambiar fotografía de portada"
            aria-describedby="view-status"
          ></div>
        </section>

        <section id="project-view" class="view" aria-labelledby="project-title">
          <h2 id="project-title" class="project-title" tabindex="-1"></h2>

          <div id="project-frame" class="frame frame-center"></div>

          <div class="controls">
            <button id="prev-btn" class="control-btn" type="button">ANTERIOR</button>
            <span class="separator">|</span>
            <button id="next-btn" class="control-btn" type="button">SIGUIENTE</button>
            <button
              id="all-btn"
              class="control-btn"
              type="button"
              aria-controls="all-grid"
              aria-expanded="false"
            >TODAS</button>
          </div>

          <div id="all-grid" class="all-grid" aria-label="Todas las fotografías" hidden></div>
        </section>

        <section id="contact-view" class="view" aria-labelledby="contact-title">
          <h2 id="contact-title" tabindex="-1">CONTACTO</h2>
          <div class="contact-card">
            <div class="contact-photo">
              <img
                src="images/contact/profile.jpg"
                alt="Retrato de Camilo Piñón Blanco"
                loading="lazy"
                width="400"
                height="400"
              />
            </div>
            <div class="contact-details">
              <p id="contact-name"></p>
              <p><a id="contact-email" href="#"></a></p>
              <p id="contact-location"></p>
            </div>
          </div>
        </section>

        <p id="view-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      </main>
    </div>

    <script src="portfolio-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
